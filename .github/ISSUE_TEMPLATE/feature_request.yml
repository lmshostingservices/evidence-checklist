name: Feature request
description: Suggest an improvement to Evidence Checklist.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the assessment task and what slows you down or is missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: unit
    attributes:
      label: Unit of competency (optional)
      placeholder: "e.g. HLTAID009"
